<script>
const FINNHUB_KEY = 'd8vbt19r01quam15pm0gd8vbt19r01quam15pm10'; // ENTER YOUR KEY HERE
const socket = new WebSocket(`wss://ws.finnhub.io?token=${FINNHUB_KEY}`);

// DOM Elements
const tapeContainer = document.getElementById('tape-stream');
const orderBookContainer = document.getElementById('order-book');

socket.addEventListener('open', () => {
    document.getElementById('status-line').textContent = "Live Feed Connected.";
    // Subscribe to both Trade (Tape) and L2 Book (Order Book)
    socket.send(JSON.stringify({'type':'subscribe', 'symbol': 'BINANCE:BTCUSDT'}));
    socket.send(JSON.stringify({'type':'subscribe', 'symbol': 'BINANCE:BTCUSDT'}));
});

socket.addEventListener('message', (event) => {
    const data = JSON.parse(event.data);
    
    if (data.type === 'trade') {
        updateTape(data.data[0]);
        updatePriceHero(data.data[0].p);
    } else if (data.type === 'l2snapshot') {
        renderOrderBook(data.data);
    }
});

function updateTape(trade) {
    if(!tapeContainer) return;
    const time = new Date(trade.t).toLocaleTimeString();
    const row = `<div style="display:flex; justify-content:space-between; font-size:10px; padding:2px; border-bottom:1px solid #172037;">
                    <span>${time}</span>
                    <span style="color:${trade.p > 0 ? 'var(--success)' : 'var(--danger)'}">${trade.p.toFixed(2)}</span>
                    <span>${trade.v.toFixed(4)}</span>
                 </div>`;
    tapeContainer.insertAdjacentHTML('afterbegin', row);
    if(tapeContainer.children.length > 15) tapeContainer.lastElementChild.remove();
}

function renderOrderBook(book) {
    if(!orderBookContainer) return;
    let html = `<div style="display:grid; grid-template-columns: 1fr 1fr 1fr; font-size:10px; gap:4px; text-align:center;">
                    <div style="color:var(--muted)">BID</div><div style="color:var(--muted)">PRICE</div><div style="color:var(--muted)">ASK</div>`;
    for(let i = 0; i < 10; i++) {
        html += `<div style="color:var(--success)">${book.bids[i]?.s || '-'}</div>
                 <div style="font-weight:bold; color:var(--text)">${book.bids[i]?.p || '-'}</div>
                 <div style="color:var(--danger)">${book.asks[i]?.s || '-'}</div>`;
    }
    orderBookContainer.innerHTML = html + '</div>';
}

function updatePriceHero(price) {
    const valEl = document.getElementById('price-value');
    if(valEl) valEl.textContent = '$' + price.toLocaleString();
}
</script>
