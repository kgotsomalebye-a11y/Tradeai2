<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TradeAI Pro - Live Market Data</title>
    <style>
        /* ... Keep your original CSS styles here ... */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .info-card { background: var(--bg3); border: 1px solid var(--border); border-radius: 16px; padding: 16px; }
    </style>
</head>
<body>

<div class="main">
    <div class="price-hero">
        <div class="price-symbol" id="price-symbol">SELECT MARKET</div>
        <div class="price-value" id="price-value">---</div>
    </div>
    
    <div class="grid">
        <div class="info-card">
            <div class="card-title">Time & Sales (Live)</div>
            <div id="tape-stream" style="height:200px; overflow-y:auto; font-family:monospace; font-size:10px;"></div>
        </div>
        <div class="info-card">
            <div class="card-title">Order Book (L2)</div>
            <div id="order-book" style="height:200px; overflow-y:auto; font-family:monospace; font-size:10px;"></div>
        </div>
    </div>
</div>

<script>
    // 1. RESTORED YOUR MARKET DATA
    const MARKETS = [
        {sym:"XAU/USD", name:"Gold Spot", price:2348.10},
        {sym:"SPX500", name:"S&P 500 Index", price:5465.30},
        {sym:"NAS100", name:"NASDAQ 100", price:19750.25}
    ];

    let currentMarket = MARKETS[0];
    const API_KEY = 'd8vbt19r01quam15pm0gd8vbt19r01quam15pm10';
    const socket = new WebSocket(`wss://ws.finnhub.io?token=${API_KEY}`);

    // 2. RESTORED PRICE UPDATES
    function updatePriceHero(livePrice) {
        document.getElementById('price-symbol').textContent = currentMarket.sym + ' · ' + currentMarket.name;
        document.getElementById('price-value').textContent = '$' + livePrice.toFixed(2);
    }

    // 3. INTEGRATED LIVE DATA
    socket.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        if(msg.type === 'trade') {
            const trade = msg.data[0];
            updatePriceHero(trade.p); // Updates your price hero live
            
            // Update Tape
            const tape = document.getElementById('tape-stream');
            tape.insertAdjacentHTML('afterbegin', `<div>${new Date().toLocaleTimeString()} | ${trade.p} | ${trade.v}</div>`);
        }
        else if(msg.type === 'l2snapshot') {
            // Update Order Book
            document.getElementById('order-book').innerHTML = `Bids: ${msg.data.bids.length} | Asks: ${msg.data.asks.length}`;
        }
    };
</script>
</body>
</html>
