<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TradeAI Pro - Live Terminal</title>
    <style>
        :root { --bg:#070a13; --bg2:#0f1526; --text:#f0f4ff; --border:rgba(255,255,255,0.06); --success:#10b981; --danger:#f43f5e; }
        body { background: var(--bg); color: var(--text); font-family: 'Space Mono', monospace; padding: 20px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .card { background: var(--bg2); border: 1px solid var(--border); padding: 15px; border-radius: 12px; }
        .row { display: grid; grid-template-columns: 1fr 1fr 1fr; font-size: 11px; padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.03); }
    </style>
</head>
<body>

<div class="grid">
    <div class="card">
        <div style="color:#7c8ba1; font-size:12px;">BTC/USDT LIVE PRICE</div>
        <div id="price-value" style="font-size:32px; font-weight:bold;">Connecting...</div>
    </div>
</div>

<div class="grid" style="margin-top:20px;">
    <div class="card">
        <div style="font-size:11px; color:#7c8ba1; margin-bottom:10px;">TIME & SALES</div>
        <div id="tape-stream"></div>
    </div>
    <div class="card">
        <div style="font-size:11px; color:#7c8ba1; margin-bottom:10px;">ORDER BOOK (L2)</div>
        <div id="order-book"></div>
    </div>
</div>

<script>
    const socket = new WebSocket('wss://ws.finnhub.io?token=d8vt9a1r01qp5hrlp1dgd8vt9a1r01qp5hrlp1e0');

    socket.onopen = () => {
        socket.send(JSON.stringify({'type':'subscribe', 'symbol': 'BINANCE:BTCUSDT'}));
    };

    socket.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        
        if(msg.type === 'trade') {
            const t = msg.data[0];
            document.getElementById('price-value').textContent = '$' + t.p.toFixed(2);
            
            const tape = document.getElementById('tape-stream');
            tape.insertAdjacentHTML('afterbegin', `
                <div class="row">
                    <span>${new Date(t.t).toLocaleTimeString()}</span>
                    <span style="color:${t.p > 0 ? '#10b981' : '#f43f5e'}">${t.p.toFixed(2)}</span>
                    <span>${t.v.toFixed(4)}</span>
                </div>`);
            if(tape.children.length > 15) tape.lastElementChild.remove();
        }
        else if(msg.type === 'l2snapshot') {
            const data = msg.data;
            const book = document.getElementById('order-book');
            book.innerHTML = data.bids.slice(0, 10).map(b => `
                <div class="row">
                    <span style="color:#10b981">${b.s}</span>
                    <span>${b.p.toFixed(2)}</span>
                    <span style="color:#f43f5e">${data.asks[0]?.s || '-'}</span>
                </div>`).join('');
        }
    };
</script>
</body>
</html>
