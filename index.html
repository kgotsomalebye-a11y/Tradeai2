<script>
    const API_KEY = 'd8vt9a1r01qp5hrlp1dgd8vt9a1r01qp5hrlp1e0';
    const socket = new WebSocket(`wss://ws.finnhub.io?token=${API_KEY}`);

    socket.onopen = () => {
        console.log("WebSocket Connected!");
        // Let's force-test with BINANCE:BTCUSDT (The only one guaranteed on free tier)
        socket.send(JSON.stringify({'type':'subscribe', 'symbol': 'BINANCE:BTCUSDT'}));
    };

    socket.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        if(msg.type === 'trade') {
            console.log("Data received:", msg); // Check your F12 Console!
            document.getElementById('price-display').textContent = '$' + msg.data[0].p.toFixed(2);
        } else if (msg.type === 'error') {
            document.getElementById('price-display').textContent = "API Error: " + msg.msg;
        }
    };

    socket.onerror = (err) => {
        document.getElementById('price-display').textContent = "Connection Failed.";
        console.error("Socket Error:", err);
    };
</script>
