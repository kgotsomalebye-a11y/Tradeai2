<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0f1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TradeAI">
<link rel="manifest" href="manifest.json">
<title>TradeAI Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0f1e;--bg2:#111827;--bg3:#1a2235;
  --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.15);
  --text:#f0f4ff;--muted:#8892a4;
  --accent:#00d4aa;--accent2:#3b82f6;
  --danger:#f43f5e;--warning:#f59e0b;--success:#10b981;
  --mono:'Space Mono',monospace;--sans:'DM Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);overflow-x:hidden}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;background:var(--bg2);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.logo{font-family:var(--mono);font-size:16px;color:var(--accent);letter-spacing:0.1em}
.top-right{display:flex;align-items:center;gap:12px}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 2s infinite}
.live-dot.stale{background:var(--warning);animation:none}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.5;transform:scale(1.3)}}
.clock{font-family:var(--mono);font-size:12px;color:var(--muted)}
.status-line{font-size:11px;color:var(--muted);padding:6px 20px;background:var(--bg2);border-bottom:1px solid var(--border);font-family:var(--mono)}
.status-line.error{color:var(--warning)}
.market-bar{padding:10px 20px;background:var(--bg2);border-bottom:1px solid var(--border);overflow-x:auto;display:flex;gap:8px}
.mkt-btn{padding:6px 16px;border-radius:20px;border:1px solid var(--border2);background:transparent;color:var(--muted);font-size:13px;cursor:pointer;white-space:nowrap;transition:all 0.2s}
.mkt-btn.active{background:var(--accent);border-color:var(--accent);color:#000;font-weight:600}
.tf-bar{padding:8px 20px;display:flex;gap:6px;background:var(--bg);border-bottom:1px solid var(--border)}
.tf-btn{padding:4px 12px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:var(--mono);font-size:12px;cursor:pointer}
.tf-btn.active{background:var(--accent2);border-color:var(--accent2);color:#fff}
.main{padding:16px 20px;max-width:1200px;margin:0 auto}
.price-hero{background:var(--bg3);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:16px}
.price-symbol{font-size:13px;color:var(--muted);letter-spacing:0.1em;font-family:var(--mono);margin-bottom:4px}
.price-value{font-family:var(--mono);font-size:36px;font-weight:700}
.price-change{font-size:14px;margin-top:4px}
.price-change.up{color:var(--success)}
.price-change.down{color:var(--danger)}
.price-meta{display:flex;gap:20px;margin-top:12px;flex-wrap:wrap}
.price-meta-item{font-size:12px;color:var(--muted)}
.price-meta-item span{color:var(--text);font-family:var(--mono);font-size:13px}
.rec-card{background:var(--bg3);border-radius:16px;padding:20px;margin-bottom:16px;border:1px solid var(--border)}
.rec-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.rec-label{font-size:11px;color:var(--muted);letter-spacing:0.12em;text-transform:uppercase}
.rec-signal{font-family:var(--mono);font-size:28px;font-weight:700}
.rec-signal.buy{color:var(--success)}
.rec-signal.hold{color:var(--warning)}
.rec-signal.avoid{color:var(--danger)}
.confidence-wrap{text-align:right}
.confidence-label{font-size:11px;color:var(--muted);margin-bottom:4px}
.confidence-num{font-family:var(--mono);font-size:28px;font-weight:700;color:var(--accent)}
.signal-bars{display:grid;gap:10px;margin-bottom:16px}
.sig-row{display:flex;align-items:center;gap:10px}
.sig-name{font-size:12px;color:var(--muted);min-width:140px}
.sig-track{flex:1;height:6px;background:rgba(255,255,255,0.06);border-radius:3px;overflow:hidden}
.sig-fill{height:100%;border-radius:3px;transition:width 0.8s ease}
.sig-pct{font-family:var(--mono);font-size:12px;color:var(--text);min-width:36px;text-align:right}
.levels-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:16px}
.level-box{background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:10px;padding:10px;text-align:center}
.level-lbl{font-size:11px;color:var(--muted);margin-bottom:4px}
.level-val{font-family:var(--mono);font-size:14px;font-weight:700}
.level-val.entry{color:var(--accent2)}
.level-val.sl{color:var(--danger)}
.level-val.tp{color:var(--success)}
.reasoning{background:rgba(0,212,170,0.04);border:1px solid rgba(0,212,170,0.15);border-radius:12px;padding:14px;font-size:13px;color:var(--muted);line-height:1.7;margin-top:14px}
.reasoning strong{color:var(--accent)}
.card-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
@media(max-width:600px){.card-grid{grid-template-columns:1fr}}
.info-card{background:var(--bg3);border:1px solid var(--border);border-radius:16px;padding:16px}
.card-title{font-size:11px;color:var(--muted);letter-spacing:0.12em;text-transform:uppercase;margin-bottom:12px}
.news-item{padding:8px 0;border-bottom:1px solid var(--border)}
.news-item:last-child{border-bottom:none}
.news-headline{font-size:13px;color:var(--text);margin-bottom:4px;line-height:1.4}
.news-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.badge{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600}
.badge.bull{background:rgba(16,185,129,0.15);color:#10b981}
.badge.bear{background:rgba(244,63,94,0.15);color:#f43f5e}
.badge.neut{background:rgba(255,255,255,0.08);color:var(--muted)}
.badge.high-imp{background:rgba(244,63,94,0.15);color:#f43f5e}
.badge.med-imp{background:rgba(245,158,11,0.15);color:#f59e0b}
.news-age{font-size:11px;color:var(--muted)}
.cal-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.cal-item:last-child{border-bottom:none}
.cal-date{font-family:var(--mono);font-size:11px;color:var(--muted);min-width:44px}
.cal-event{font-size:13px;color:var(--text);flex:1}
.action-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:24px}
@media(max-width:500px){.action-row{grid-template-columns:1fr}}
.action-btn{padding:12px;border-radius:12px;border:1px solid var(--border2);background:transparent;color:var(--text);font-size:13px;cursor:pointer;text-align:center}
.action-btn:hover{background:rgba(255,255,255,0.05);border-color:var(--accent);color:var(--accent)}
.refresh-btn{position:fixed;bottom:24px;right:20px;width:52px;height:52px;border-radius:50%;background:var(--accent);border:none;color:#000;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(0,212,170,0.4);z-index:200}
.refresh-btn.spinning svg{animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,0.2);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;vertical-align:middle;margin-right:6px}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">TRADE<span style="color:#fff">AI</span></div>
  <div class="top-right">
    <div class="live-dot" id="live-dot"></div>
    <div class="clock" id="clock">--:--:--</div>
  </div>
</div>
<div class="status-line" id="status-line">Starting up...</div>

<div class="market-bar" id="market-bar"></div>
<div class="tf-bar" id="tf-bar"></div>

<div class="main">

  <div class="price-hero">
    <div class="price-symbol" id="price-symbol">—</div>
    <div class="price-value" id="price-value">—</div>
    <div class="price-change" id="price-change">Loading...</div>
    <div class="price-meta">
      <div class="price-meta-item">Open <span id="p-open">—</span></div>
      <div class="price-meta-item">High <span id="p-high">—</span></div>
      <div class="price-meta-item">Low <span id="p-low">—</span></div>
      <div class="price-meta-item">ATR <span id="p-atr">—</span></div>
    </div>
  </div>

  <div class="rec-card">
    <div class="rec-header">
      <div>
        <div class="rec-label">AI recommendation</div>
        <div class="rec-signal hold" id="rec-signal">—</div>
      </div>
      <div class="confidence-wrap">
        <div class="confidence-label">Confidence</div>
        <div class="confidence-num" id="conf-num">—%</div>
      </div>
    </div>
    <div class="signal-bars">
      <div class="sig-row"><div class="sig-name">EMA trend</div><div class="sig-track"><div class="sig-fill" id="bar-ema" style="width:0%;background:#10b981"></div></div><div class="sig-pct" id="pct-ema">—</div></div>
      <div class="sig-row"><div class="sig-name">MACD momentum</div><div class="sig-track"><div class="sig-fill" id="bar-macd" style="width:0%;background:#3b82f6"></div></div><div class="sig-pct" id="pct-macd">—</div></div>
      <div class="sig-row"><div class="sig-name">News sentiment</div><div class="sig-track"><div class="sig-fill" id="bar-news" style="width:0%;background:#00d4aa"></div></div><div class="sig-pct" id="pct-news">—</div></div>
      <div class="sig-row"><div class="sig-name" style="color:var(--text);font-weight:500">Combined</div><div class="sig-track"><div class="sig-fill" id="bar-comb" style="width:0%;background:#a78bfa"></div></div><div class="sig-pct" id="pct-comb" style="color:var(--accent)">—</div></div>
    </div>
    <div class="levels-row">
      <div class="level-box"><div class="level-lbl">Entry</div><div class="level-val entry" id="lv-entry">—</div></div>
      <div class="level-box"><div class="level-lbl">Stop loss</div><div class="level-val sl" id="lv-sl">—</div></div>
      <div class="level-box"><div class="level-lbl">Take profit</div><div class="level-val tp" id="lv-tp">—</div></div>
    </div>
    <div class="reasoning" id="reasoning"><span class="spinner"></span> Loading analysis...</div>
  </div>

  <div class="card-grid">
    <div class="info-card">
      <div class="card-title">Economic calendar</div>
      <div id="cal-feed"></div>
    </div>
    <div class="info-card">
      <div class="card-title">News sentiment</div>
      <div id="news-feed"></div>
    </div>
  </div>

  <div class="action-row">
    <button class="action-btn" onclick="askAI('full')">🔍 Full AI analysis</button>
    <button class="action-btn" onclick="askAI('news')">📰 Latest news</button>
    <button class="action-btn" onclick="askAI('macro')">🌍 Macro outlook</button>
  </div>

</div>

<button class="refresh-btn" id="refresh-btn" onclick="refresh(true)">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M23 4v6h-6"/><path d="M1 20v-6h6"/>
    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
  </svg>
</button>

<script>
const TWELVE_DATA_KEY = 'cc07f95e31b34fc8a4d42e62f9af97c6';
const NEWS_API_KEY = '018fe5459e2546af8a8018fd3c55e61b';

const MARKETS = [
  {sym:"XAU/USD", tdSym:"XAU/USD", name:"Gold Spot",  cat:"commodity", price:2335.50, open:2325.00, high:2342.10, low:2320.40, chg:10.50, chgPct:0.45},
  {sym:"WTI/USD", tdSym:"WTI/USD", name:"Crude Oil WTI", cat:"commodity", price:78.45, open:78.77, high:79.12, low:78.10, chg:-0.32, chgPct:-0.41},
  {sym:"USD/ZAR", tdSym:"USD/ZAR", name:"US Dollar / Rand", cat:"forex", price:18.45, open:18.32, high:18.58, low:18.28, chg:0.13, chgPct:0.71},
  {sym:"USD/CNY", tdSym:"USD/CNY", name:"US Dollar / Yuan", cat:"forex", price:7.24, open:7.22, high:7.26, low:7.21, chg:0.02, chgPct:0.28},
]

const TIMEFRAMES = ["15m","30m","1H","4H"]
const TECH_BY_TF = {
  "15m":{emaScore:42,macdScore:46,bull:false,ema:"Mixed",trend:"Below 200"},
  "30m":{emaScore:53,macdScore:57,bull:false,ema:"Above 20/50",trend:"Below 200"},
  "1H": {emaScore:68,macdScore:64,bull:true, ema:"Above 20/50",trend:"Above 200"},
  "4H": {emaScore:80,macdScore:74,bull:true, ema:"Above 20/50",trend:"Above 200"},
}

const NEWS_FALLBACK = {
  "XAU/USD":[{h:"Fed rate-hold expectations continue to support gold",s:"bull",i:"high",a:"recent"},{h:"USD softness keeps gold demand elevated",s:"bull",i:"med",a:"recent"}],
  "WTI/USD":[{h:"OPEC+ supply policy remains key driver for crude",s:"neut",i:"high",a:"recent"},{h:"Inventory data in focus this week",s:"neut",i:"med",a:"recent"}],
  "USD/ZAR":[{h:"Rand sensitive to SARB rate outlook and risk sentiment",s:"neut",i:"high",a:"recent"},{h:"Commodity price swings continue to move ZAR",s:"neut",i:"med",a:"recent"}],
  "USD/CNY":[{h:"PBOC fixing remains closely watched by markets",s:"neut",i:"high",a:"recent"},{h:"China growth data in focus for yuan direction",s:"neut",i:"med",a:"recent"}],
}

const CAL_DATA = [
  {e:"FOMC meeting minutes",d:"Jun 10",i:"high"},
  {e:"US CPI inflation data",d:"Jun 11",i:"high"},
  {e:"China trade balance",d:"Jun 12",i:"med"},
  {e:"SARB interest rate decision",d:"Jun 13",i:"high"},
  {e:"US crude oil inventories",d:"Jun 14",i:"med"},
]

let currentMarket = MARKETS[0]
let currentTF = "1H"
let liveDataOk = false
let lastFetchFailed = false

function setStatus(msg, isError) {
  const el = document.getElementById('status-line')
  el.textContent = msg
  el.className = 'status-line' + (isError ? ' error' : '')
  document.getElementById('live-dot').className = 'live-dot' + (isError ? ' stale' : '')
}

function buildMarketBar() {
  document.getElementById('market-bar').innerHTML = MARKETS.map(m =>
    `<button class="mkt-btn ${m.sym===currentMarket.sym?'active':''}" onclick="selectMarket('${m.sym}')">${m.sym}</button>`
  ).join('')
}
function buildTFBar() {
  document.getElementById('tf-bar').innerHTML = TIMEFRAMES.map(tf =>
    `<button class="tf-btn ${tf===currentTF?'active':''}" onclick="selectTF('${tf}')">${tf}</button>`
  ).join('')
}
function selectMarket(sym) {
  currentMarket = MARKETS.find(m => m.sym === sym)
  buildMarketBar()
  updatePriceHero()
  updateAnalysis()
  updateNews()
}
function selectTF(tf) {
  currentTF = tf
  buildTFBar()
  updateAnalysis()
}

function fmt(price) {
  if (price > 100) return price.toFixed(2)
  return price.toFixed(4)
}

function updatePriceHero() {
  const m = currentMarket
  const isUp = m.chg >= 0
  const prefix = (m.sym === 'XAU/USD' || m.sym === 'WTI/USD') ? '$' : ''
  document.getElementById('price-symbol').textContent = m.sym + ' · ' + m.name
  document.getElementById('price-value').textContent = prefix + fmt(m.price)
  const ce = document.getElementById('price-change')
  ce.textContent = (isUp?'▲ +':'▼ ') + fmt(Math.abs(m.chg)) + ' (' + (isUp?'+':'') + m.chgPct.toFixed(2) + '%) today'
  ce.className = 'price-change ' + (isUp?'up':'down')
  document.getElementById('p-open').textContent = fmt(m.open)
  document.getElementById('p-high').textContent = fmt(m.high)
  document.getElementById('p-low').textContent = fmt(m.low)
  document.getElementById('p-atr').textContent = fmt((m.high - m.low) || 1)
}

function setBar(id, pct, delay) {
  setTimeout(() => { const e = document.getElementById(id); if (e) e.style.width = pct + '%' }, delay)
}

function updateAnalysis() {
  const tech = TECH_BY_TF[currentTF]
  const items = NEWS_FALLBACK[currentMarket.sym] || []
  const bullCount = items.filter(n => n.s === 'bull').length
  const newsScore = items.length ? Math.round((bullCount / items.length) * 100) : 50
  const econScore = currentTF === '4H' ? 60 : currentTF === '1H' ? 52 : 44
  const combined = Math.round(tech.emaScore*0.4 + tech.macdScore*0.25 + newsScore*0.2 + econScore*0.15)

  setBar('bar-ema', tech.emaScore, 80)
  setBar('bar-macd', tech.macdScore, 160)
  setBar('bar-news', newsScore, 240)
  setBar('bar-comb', combined, 320)
  document.getElementById('pct-ema').textContent = tech.emaScore + '%'
  document.getElementById('pct-macd').textContent = tech.macdScore + '%'
  document.getElementById('pct-news').textContent = newsScore + '%'
  document.getElementById('pct-comb').textContent = combined + '%'
  document.getElementById('conf-num').textContent = combined + '%'

  const recEl = document.getElementById('rec-signal')
  if (combined >= 65 && tech.bull) { recEl.textContent='BUY'; recEl.className='rec-signal buy' }
  else if (combined >= 45) { recEl.textContent='HOLD'; recEl.className='rec-signal hold' }
  else { recEl.textContent='AVOID'; recEl.className='rec-signal avoid' }

  const price = currentMarket.price
  const atr = (currentMarket.high - currentMarket.low) || 1
  document.getElementById('lv-entry').textContent = fmt(price)
  document.getElementById('lv-sl').textContent = fmt(price - atr*2)
  document.getElementById('lv-tp').textContent = fmt(price + atr*4)

  const sig = recEl.textContent
  document.getElementById('reasoning').innerHTML = sig === 'BUY'
    ? `<strong>${currentMarket.sym} on ${currentTF}</strong> — EMA trend and MACD momentum are aligned bullishly (${tech.emaScore}% / ${tech.macdScore}%). News sentiment is ${newsScore}% supportive. Combined confidence <strong>${combined}%</strong> favours a long entry. SL ${fmt(price-atr*2)} · TP ${fmt(price+atr*4)}.`
    : sig === 'HOLD'
    ? `<strong>${currentMarket.sym} on ${currentTF}</strong> — Mixed signals on this timeframe. Combined confidence <strong>${combined}%</strong> — wait for a cleaner setup or check a higher timeframe.`
    : `<strong>${currentMarket.sym} on ${currentTF}</strong> — Signals not aligned (combined confidence <strong>${combined}%</strong>). Avoid trading this pair on the ${currentTF} until conditions improve.`
}

function updateNews() {
  const items = NEWS_FALLBACK[currentMarket.sym] || []
  document.getElementById('news-feed').innerHTML = items.map(n => `
    <div class="news-item">
      <div class="news-headline">${n.h}</div>
      <div class="news-meta">
        <span class="badge ${n.s==='bull'?'bull':n.s==='bear'?'bear':'neut'}">${n.s==='bull'?'Bullish':n.s==='bear'?'Bearish':'Neutral'}</span>
        <span class="badge ${n.i==='high'?'high-imp':'med-imp'}">${n.i==='high'?'High':'Med'} impact</span>
        <span class="news-age">${n.a}</span>
      </div>
    </div>`).join('')
}

function updateCal() {
  document.getElementById('cal-feed').innerHTML = CAL_DATA.map(c => `
    <div class="cal-item">
      <div class="cal-date">${c.d}</div>
      <div class="cal-event">${c.e}</div>
      <span class="badge ${c.i==='high'?'high-imp':'med-imp'}">${c.i==='high'?'High':'Med'}</span>
    </div>`).join('')
}

function askAI(type) {
  const sym = currentMarket.sym, tf = currentTF
  const p = {
    full:`Give me a detailed trading analysis for ${sym} on the ${tf} timeframe, including technical trend and whether current news supports a trade.`,
    news:`Search for the latest news on ${sym} and tell me how it should affect my trading decision today.`,
    macro:`What is the current macro outlook for ${sym}? Include relevant central bank policy and key drivers.`
  }
  alert('Ask me:\n\n"' + p[type] + '"')
}

async function fetchLivePrices() {
  if (TWELVE_DATA_KEY === 'cc07f95e31b34fc8a4d42e62f9af97c6') {
    setStatus('Demo data — add your Twelve Data key in the code to go live', false)
    return
  }
  const symbols = MARKETS.map(m => m.tdSym).join(',')
  try {
    setStatus('Fetching live prices...', false)
    const res = await fetch(`https://api.twelvedata.com/quote?symbol=${encodeURIComponent(symbols)}&apikey=${TWELVE_DATA_KEY}`)
    const data = await res.json()

    const lookup = data.symbol ? {[data.symbol]: data} : data

    let updatedAny = false
    MARKETS.forEach(m => {
      const d = lookup[m.tdSym]
      if (d && d.close && !d.code) {
        m.price = parseFloat(d.close)
        m.open = parseFloat(d.open) || m.open
        m.high = parseFloat(d.high) || m.high
        m.low = parseFloat(d.low) || m.low
        m.chg = parseFloat(d.change) || (m.price - m.open)
        m.chgPct = parseFloat(d.percent_change) || ((m.chg / m.open) * 100)
        updatedAny = true
      }
    })

    if (updatedAny) {
      lastFetchFailed = false
      liveDataOk = true
      setStatus('Live · last updated ' + new Date().toLocaleTimeString(), false)
      updatePriceHero()
      updateAnalysis()
    } else {
      throw new Error(data.message || 'No valid price data returned')
    }
  } catch (e) {
    lastFetchFailed = true
    setStatus('Live data unavailable right now — showing last known prices (' + e.message + ')', true)
    console.log('Price fetch error:', e)
  }
}

async function fetchLiveNews() {
  if (NEWS_API_KEY === '018fe5459e2546af8a8018fd3c55e61b') return
  try {
    const query = currentMarket.sym === 'XAU/USD' ? 'gold price' :
                  currentMarket.sym === 'WTI/USD' ? 'oil price' :
                  currentMarket.sym === 'USD/ZAR' ? 'south african rand' : 'chinese yuan'
    const res = await fetch(`https://newsapi.org/v2/everything?q=${encodeURIComponent(query)}&sortBy=publishedAt&pageSize=4&apiKey=${NEWS_API_KEY}`)
    const data = await res.json()
    if (data.articles && data.articles.length) {
      document.getElementById('news-feed').innerHTML = data.articles.map(a => `
        <div class="news-item">
          <div class="news-headline">${a.title}</div>
          <div class="news-meta">
            <span class="badge bull">Live</span>
            <span class="news-age">${new Date(a.publishedAt).toLocaleTimeString()}</span>
          </div>
        </div>`).join('')
    }
  } catch (e) {
    console.log('News fetch error:', e)
  }
}

function refresh(manual) {
  const btn = document.getElementById('refresh-btn')
  btn.classList.add('spinning')
  updatePriceHero()
  updateAnalysis()
  updateNews()
  updateCal()
  fetchLivePrices()
  if (manual) fetchLiveNews()
  setTimeout(() => btn.classList.remove('spinning'), 800)
}

function updateClock() {
  document.getElementById('clock').textContent = new Date().toUTCString().slice(17,25) + ' UTC'
}

buildMarketBar()
buildTFBar()
refresh(false)
setInterval(updateClock, 1000)
updateClock()

setInterval(fetchLivePrices, 300000)
setInterval(fetchLiveNews, 900000)
</script>
</body>
</html>
