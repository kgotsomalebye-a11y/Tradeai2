<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0f1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TradeAI-Pro">
<title>TradeAI Pro - Order Flow Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070a13;--bg2:#0f1526;--bg3:#172037;
  --border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.12);
  --text:#f0f4ff;--muted:#7c8ba1;
  --accent:#00ffcc;--accent2:#38bdf8;
  --danger:#f43f5e;--warning:#fbbf24;--success:#10b981;
  --mono:'Space Mono',monospace;--sans:'DM Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);overflow-x:hidden}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;background:var(--bg2);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.logo{font-family:var(--mono);font-size:16px;color:var(--accent);letter-spacing:0.12em;font-weight:700}
.top-right{display:flex;align-items:center;gap:12px}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.5;transform:scale(1.3)}}
.clock{font-family:var(--mono);font-size:12px;color:var(--muted)}
.status-line{font-size:11px;color:var(--muted);padding:6px 20px;background:var(--bg2);border-bottom:1px solid var(--border);font-family:var(--mono)}
.market-bar{padding:10px 20px;background:var(--bg2);border-bottom:1px solid var(--border);overflow-x:auto;display:flex;gap:8px}
.mkt-btn{padding:6px 16px;border-radius:20px;border:1px solid var(--border2);background:transparent;color:var(--muted);font-size:13px;cursor:pointer;white-space:nowrap;transition:all 0.2s}
.mkt-btn.active{background:var(--accent);border-color:var(--accent);color:#000;font-weight:600}
.tf-bar{padding:8px 20px;display:flex;gap:6px;background:var(--bg);border-bottom:1px solid var(--border)}
.tf-btn{padding:4px 12px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:var(--mono);font-size:12px;cursor:pointer}
.tf-btn.active{background:var(--accent2);border-color:var(--accent2);color:#fff}
.main{padding:16px 20px;max-width:1200px;margin:0 auto}
.price-hero{background:var(--bg3);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:16px}
.price-symbol{font-size:13px;color:var(--muted);letter-spacing:0.1em;font-family:var(--mono);margin-bottom:4px}
.price-value{font-family:var(--mono);font-size:36px;font-weight:700}
.price-change{font-size:14px;margin-top:4px}
.price-change.up{color:var(--success)}
.price-change.down{color:var(--danger)}
.price-meta{display:flex;gap:20px;margin-top:12px;flex-wrap:wrap}
.price-meta-item{font-size:12px;color:var(--muted)}
.price-meta-item span{color:var(--text);font-family:var(--mono);font-size:13px}

.footprint-container {background:var(--bg3);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:16px;}
.footprint-header {font-size:11px;color:var(--muted);letter-spacing:0.12em;text-transform:uppercase;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;}
.footprint-grid {display:flex;gap:16px;overflow-x:auto;padding-bottom:10px;}
.footprint-candle {flex:1;min-width:180px;background:rgba(255,255,255,0.02);border:1px solid var(--border);border-radius:8px;padding:10px;}
.candle-meta {font-family:var(--mono);font-size:11px;text-align:center;padding-bottom:8px;border-bottom:1px solid var(--border);margin-bottom:8px;display:flex;justify-content:space-between;}
.footprint-row {display:grid;grid-template-columns:1fr 2fr 1fr;gap:4px;font-family:var(--mono);font-size:11px;padding:3px 4px;margin:2px 0;border-radius:4px;}
.footprint-row.poc {background:rgba(0,255,204,0.12);border:1px solid rgba(0,255,204,0.3);color:var(--accent);font-weight:700;}
.fp-bid {color:var(--danger);text-align:left;}
.fp-price {color:var(--muted);text-align:center;font-weight:600;}
.fp-ask {color:var(--success);text-align:right;}

.rec-card{background:var(--bg3);border-radius:16px;padding:20px;margin-bottom:16px;border:1px solid var(--border)}
.rec-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.rec-label{font-size:11px;color:var(--muted);letter-spacing:0.12em;text-transform:uppercase}
.rec-signal{font-family:var(--mono);font-size:28px;font-weight:700}
.rec-signal.buy{color:var(--success)}
.rec-signal.hold{color:var(--warning)}
.rec-signal.avoid{color:var(--danger)}
.confidence-wrap{text-align:right}
.confidence-label{font-size:11px;color:var(--muted);margin-bottom:4px}
.confidence-num{font-family:var(--mono);font-size:28px;font-weight:700;color:var(--accent)}
.signal-bars{display:grid;gap:10px;margin-bottom:16px}
.sig-row{display:flex;align-items:center;gap:10px}
.sig-name{font-size:12px;color:var(--muted);min-width:160px}
.sig-track{flex:1;height:6px;background:rgba(255,255,255,0.04);border-radius:3px;overflow:hidden}
.sig-fill{height:100%;border-radius:3px;transition:width 0.8s ease}
.sig-pct{font-family:var(--mono);font-size:12px;color:var(--text);min-width:42px;text-align:right}
.levels-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:16px}
.level-box{background:rgba(255,255,255,0.02);border:1px solid var(--border);border-radius:10px;padding:10px;text-align:center}
.level-lbl{font-size:11px;color:var(--muted);margin-bottom:4px}
.level-val{font-family:var(--mono);font-size:14px;font-weight:700}
.level-val.entry{color:var(--accent2)}
.level-val.sl{color:var(--danger)}
.level-val.tp{color:var(--success)}
.reasoning{background:rgba(0,255,204,0.03);border:1px solid rgba(0,255,204,0.12);border-radius:12px;padding:14px;font-size:13px;color:var(--muted);line-height:1.7;margin-top:14px}
.reasoning strong{color:var(--accent)}
.card-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
@media(max-width:768px){.card-grid{grid-template-columns:1fr}}
.info-card{background:var(--bg3);border:1px solid var(--border);border-radius:16px;padding:16px}
.card-title{font-size:11px;color:var(--muted);letter-spacing:0.12em;text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.card-title-tag{font-size:9px;padding:2px 6px;border-radius:8px;background:rgba(255,255,255,0.06);color:var(--muted)}
.rules-list{display:flex;flex-direction:column;gap:10px}
.rule-item{font-size:12px;line-height:1.5;padding:8px;border-radius:8px;background:rgba(255,255,255,0.01);border-left:3px solid var(--accent2)}
.rule-item.risk{border-left-color:var(--danger)}
.rule-item strong{color:var(--text)}
.news-item{padding:8px 0;border-bottom:1px solid var(--border)}
.news-headline{font-size:13px;line-height:1.4;margin-bottom:4px}
.news-meta{display:flex;gap:8px;align-items:center}
.badge{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600}
.badge.bull{background:rgba(16,185,129,0.15);color:#10b981}
.badge.bear{background:rgba(244,63,94,0.15);color:#f43f5e}
.badge.neut{background:rgba(255,255,255,0.08);color:var(--muted)}
.action-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:24px}
