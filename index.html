<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TradeAI Pro - Live Market Data</title>
    <style>
        /* Keep your existing :root and CSS styles as they are */
        .tape-row { display: grid; grid-template-columns: 1fr 1fr 1fr; font-size: 10px; font-family: 'Space Mono'; border-bottom: 1px solid rgba(255,255,255,0.05); padding: 4px; }
        .bid { color: #10b981; } .ask { color: #f43f5e; }
    </style>
</head>
<body>
    <div class="card-grid">
        <div class="info-card">
            <div class="card-title">Time & Sales (Live) <span id="conn-status">Connecting...</span></div>
            <div id="tape-stream" style="height:300px; overflow-y:auto;"></div>
        </div>
        <div class="info-card">
            <div class="card-title">Live Order Book (L2)</div>
            <div id="order-book" style="height:300px;"></div>
        </div>
    </div>

<script>
    const API_KEY = 'd8vbt19r01quam15pm0gd8vbt19r01quam15pm10'; 
    const socket = new WebSocket(`wss://ws.finnhub.io?token=${API_KEY}`);

    // UI ELEMENTS
    const tape = document.getElementById('tape-stream');
    const book = document.getElementById('order-book');
    const status = document.getElementById('conn-status');

    socket.onopen = () => {
        status.textContent = "Live";
        // Subscribe to BTC/USDT Trade and L2 Book
        socket.send(JSON.stringify({'type':'subscribe', 'symbol': 'BINANCE:BTCUSDT'}));
        socket.send(JSON.stringify({'type':'subscribe', 'symbol': 'BINANCE:BTCUSDT'})); 
    };

    socket.onmessage = (event) => {
        const res = JSON.parse(event.data);
        if (res.type === 'trade') {
            const t = res.data[0];
            tape.insertAdjacentHTML('afterbegin', `
                <div class="tape-row">
                    <span>${new Date(t.t).toLocaleTimeString()}</span>
                    <span>${t.p.toFixed(2)}</span>
                    <span style="color:${t.p > 0 ? '#10b981' : '#f43f5e'}">${t.v.toFixed(4)}</span>
                </div>`);
            if(tape.children.length > 30) tape.lastElementChild.remove();
        } 
        else if (res.type === 'l2snapshot') {
            const data = res.data;
            let html = `<div style="display:grid; grid-template-columns: 1fr 1fr 1fr; text-align:center; font-size:10px;">`;
            for(let i=0; i<8; i++) {
                html += `<div class="bid">${data.bids[i]?.s || '-'}</div>
                         <div style="color:#fff">${data.bids[i]?.p || '-'}</div>
                         <div class="ask">${data.asks[i]?.s || '-'}</div>`;
            }
            book.innerHTML = html + '</div>';
        }
    };
</script>
</body>
</html>
